name: Deploy to production

on:
  push:
    branches: [ main ]


jobs:

  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: tainguyen2812/simple-payment-backend:latest

      - name: Configure Render credentials
        run: curl -f -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Deploy image to K8s
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml 
          kubectl apply -f k8s/issuers.yaml 
          kubectl apply -f k8s/gateway-class.yaml 
          kubectl apply -f k8s/gateway.yaml 
          kubectl apply -f k8s/httproute.yaml 
          kubectl apply -f k8s/metallb-pool.yaml 
          kubectl apply -f k8s/certificate.yaml  
